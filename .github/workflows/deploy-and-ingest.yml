name: Deploy & Zero-Key OSINT Ingest

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Sweep all 15 U.S. government & hyperscaler feeds every 3 hours (8x daily)
    - cron: '0 */3 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  ingest-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Capture pre-ingest signal & feed health fingerprint
        id: pre_sig
        run: |
          if [ -f src/data/liveSignals.json ] && [ -f src/data/feedHealth.json ]; then
            FP=$(node -e "const d=require('./src/data/liveSignals.json'); const h=require('./src/data/feedHealth.json'); console.log(JSON.stringify({s:(d.signals||[]).map(s=>s.id+':'+s.title+':'+s.severity), h:(h.feeds||[]).map(f=>f.id+':'+f.status)}));" | sha256sum | awk '{print $1}')
          else
            FP="empty"
          fi
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"

      - name: Sync canonical briefing (when GOOGLE_SERVICE_ACCOUNT_JSON is configured)
        id: doc_sync
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            npm run sync:doc
            if ! git diff --quiet content/executive_briefing.md src/data/riskMatrix.json src/data/incidents.json src/data/countdownCliffs.json src/data/watchlist.json src/data/sections.json src/data/changelog.json; then
              echo "doc_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "doc_changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Using committed canonical src/data/*.json snapshot (verified by Vitest)."
            echo "doc_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Zero-Key 15-Feed Federal & Hyperscaler OSINT Collector
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run ingest:signals

      - name: TypeScript & Vitest verification suite
        run: |
          npx tsc --noEmit
          npm test

      - name: Commit updated canonical doc & OSINT telemetry
        env:
          PRE_FP: ${{ steps.pre_sig.outputs.fingerprint }}
          DOC_CHANGED: ${{ steps.doc_sync.outputs.doc_changed }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          POST_FP=$(node -e "const d=require('./src/data/liveSignals.json'); const h=require('./src/data/feedHealth.json'); console.log(JSON.stringify({s:(d.signals||[]).map(s=>s.id+':'+s.title+':'+s.severity), h:(h.feeds||[]).map(f=>f.id+':'+f.status)}));" | sha256sum | awk '{print $1}')
          if [ "$DOC_CHANGED" = "true" ] || [ "$PRE_FP" != "$POST_FP" ] || [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/liveSignals.json src/data/feedHealth.json src/data/feedHistory.json
            if [ "$DOC_CHANGED" = "true" ]; then
              git add content/executive_briefing.md src/data/riskMatrix.json src/data/incidents.json src/data/countdownCliffs.json src/data/watchlist.json src/data/sections.json src/data/changelog.json
            fi
            if git diff --cached --quiet; then
              echo "No staged telemetry changes to commit; skipping push."
            else
              echo "Persisting telemetry/canonical briefing updates (event=$EVENT_NAME, doc_changed=$DOC_CHANGED)..."
              git commit -m "chore(sync): update canonical briefing & 15-feed OSINT telemetry [skip ci]"
              git pull --rebase -X theirs origin main
              git push origin HEAD:main
            fi
          else
            echo "Canonical briefing and signal set unchanged on push event; skipping repository commit."
          fi

      - name: Build static Next.js 15 portal
        env:
          GITHUB_ACTIONS: 'true'
          GITHUB_REPOSITORY: ${{ github.repository }}
          SITE_PASSCODE: ${{ secrets.SITE_PASSCODE || 'PUBLIC' }}
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload static export artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: ingest-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
